name: iOS build (unsigned IPA)

# Builds the iPad app on a GitHub-hosted macOS runner and uploads an UNSIGNED
# .ipa artifact. Install it on an iPad with AltStore/SideStore (which signs it
# on-device with a free Apple ID). No Mac required to produce or install it.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15   # Xcode 16 — reads XcodeGen's current project format (objectVersion 77)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch runtime libs + free sample model (redistributable; not committed)
        working-directory: ios
        run: |
          set -e
          mkdir -p web/lib web/model
          # Official Cubism Web Core + MIT renderer libs
          curl -fSL -o web/lib/live2dcubismcore.min.js https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js
          curl -fSL -o web/lib/pixi.min.js            https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js
          curl -fSL -o web/lib/cubism4.min.js         https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js
          # Official FREE sample model (Live2D Free Material License)
          curl -fSL -o /tmp/hiyori.zip https://cubism.live2d.com/sample-data/bin/hiyori/hiyori_en.zip
          (cd /tmp && unzip -oq hiyori.zip)
          cp -R "/tmp/hiyori_free/runtime/." web/model/
          echo "web/ bundle contents:" && find web -maxdepth 2 | sort

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build & archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Ipad2D.xcodeproj \
            -scheme Ipad2D \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Ipad2D.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | xcpretty || xcodebuild \
            -project Ipad2D.xcodeproj -scheme Ipad2D -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ipad2D.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(ls -d build/Ipad2D.xcarchive/Products/Applications/*.app | head -1)
          echo "app bundle: $APP"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry Ipad2D-unsigned.ipa Payload)
          ls -lh build/Ipad2D-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ipad2D-unsigned-ipa
          path: ios/build/Ipad2D-unsigned.ipa
          if-no-files-found: error

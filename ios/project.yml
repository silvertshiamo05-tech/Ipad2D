# XcodeGen spec — the .xcodeproj is generated in CI, not committed (pbxproj is
# fragile to hand-edit). See .github/workflows/ios.yml.
name: Ipad2D
options:
  bundleIdPrefix: com.ipad2d
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Ipad2D:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: web
        type: folder   # folder reference → copied into the bundle as web/ (index.html, lib/, model/)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipad2d.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Ipad2D"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
schemes:
  Ipad2D:
    build:
      targets:
        Ipad2D: all
    run:
      config: Release
    archive:
      config: Release

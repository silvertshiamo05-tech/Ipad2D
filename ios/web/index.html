<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #c{display:block;width:100vw;height:100vh;touch-action:none;}
  #msg{position:fixed;left:0;right:0;bottom:16px;text-align:center;font:14px -apple-system,sans-serif;color:#9aa0a6;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">loading model…</div>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/pixi.min.js"></script>
<script src="lib/cubism4.min.js"></script>
<script>
// The model path is written by the build (ios/web/model/). Keep in sync with
// the CI "Fetch sample model" step.
const MODEL = 'model/hiyori_free_t08.model3.json';
const msg = document.getElementById('msg');
(async () => {
  try {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const app = new PIXI.Application({
      view: document.getElementById('c'),
      resizeTo: window,
      backgroundAlpha: 0,
      antialias: true,
      resolution: dpr,
      autoDensity: true,
    });
    const L2D = PIXI.live2d;
    // autoInteract: the model's gaze follows touch / Apple Pencil.
    const model = await L2D.Live2DModel.from(MODEL, { autoInteract: true });
    app.stage.addChild(model);
    const fit = () => {
      const W = app.renderer.width / dpr, H = app.renderer.height / dpr;
      const s = Math.min(W / model.width, H / model.height) * 0.92;
      model.scale.set(s);
      model.anchor.set(0.5, 0.5);
      model.position.set(W / 2, H / 2);
    };
    fit();
    window.addEventListener('resize', fit);
    msg.textContent = 'Live2D model rendered on-device · tap/drag to move its gaze';
    setTimeout(() => { msg.style.opacity = '0'; msg.style.transition = 'opacity 1s'; }, 3500);
  } catch (e) {
    msg.textContent = 'render error: ' + (e && e.message || e);
    msg.style.color = '#e06';
  }
})();
</script>
</body>
</html>
